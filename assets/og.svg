<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Vorschaubild beim Teilen. 1200x630 ist das Maß, das alle Netzwerke
       erwarten; abweichende Formate werden hart beschnitten. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff0ff"/><stop offset="1" stop-color="#f6f9fc"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c5aee"/><stop offset="1" stop-color="#3ecfd5"/>
    </linearGradient>
    <radialGradient id="au" cx=".8" cy=".1" r=".8">
      <stop offset="0" stop-color="#5c5aee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5c5aee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#au)"/>

  <g transform="translate(96,150)">
    <g transform="scale(3.4)">
      <path d="M16 2C8.3 2 2 7.6 2 14.5c0 3.9 2 7.4 5.2 9.7v5.1c0 .6.7 1 1.2.6l5-3.6c.8.1 1.7.2 2.6.2 7.7 0 14-5.6 14-12.5S23.7 2 16 2z" fill="url(#v)"/>
      <g fill="#fff">
        <rect x="8.6" y="12" width="2.8" height="5" rx="1.4"/>
        <rect x="13" y="8.8" width="2.8" height="11.4" rx="1.4"/>
        <rect x="17.4" y="10.6" width="2.8" height="7.8" rx="1.4"/>
        <rect x="21.8" y="12.6" width="2.8" height="3.8" rx="1.4"/>
      </g>
    </g>
    <text x="130" y="78" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#0a2540">Vocaris</text>
    <text x="4" y="176" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#0a2540">Der KI-Telefonassistent,</text>
    <text x="4" y="230" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#0a2540">der ans Telefon geht.</text>
    <text x="4" y="296" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#425466">Termine, Reservierungen, Rückrufe — rund um die Uhr. In der EU gehostet.</text>
  </g>
</svg>
