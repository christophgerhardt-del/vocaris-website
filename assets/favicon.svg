<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Vocaris — fünf Pegelbalken, die ein V formen. Dunkler Grund, damit das
       Zeichen im Browser-Reiter auf hellen wie dunklen Leisten steht. -->
  <defs><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c5aee"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect width="32" height="32" rx="8" fill="#0a1a3a"/>
  <g fill="url(#v)" transform="translate(4 5) scale(0.706)">
    <rect x="1" y="4" width="5" height="24" rx="2.5"/><rect x="8" y="9" width="5" height="14" rx="2.5"/>
    <rect x="15" y="13.5" width="5" height="5" rx="2.5"/><rect x="22" y="9" width="5" height="14" rx="2.5"/>
    <rect x="29" y="4" width="5" height="24" rx="2.5"/>
  </g>
</svg>
